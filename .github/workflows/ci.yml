name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─────────────────────────── BACKEND BUILD ───────────────────────────
  backend-build:
    name: Backend / Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile (skip tests)
        run: ./mvnw -B -ntp clean compile -DskipTests

  # ─────────────────────────── BACKEND TEST ────────────────────────────
  backend-test:
    name: Backend / Test
    runs-on: ubuntu-latest
    needs: backend-build
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: urlshortener
          POSTGRES_USER: urlshortener
          POSTGRES_PASSWORD: urlshortener
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U urlshortener -d urlshortener"
          --health-interval 5s --health-timeout 5s --health-retries 10
      # Must be redis-stack, not plain redis: the app uses RedisBloom commands
      # (BF.ADD / BF.EXISTS / BF.RESERVE) which only exist with the module loaded.
      redis:
        image: redis/redis-stack-server:7.4.0-v3
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Names must match the placeholders in src/test/resources/application-test.properties.
      SPRING_PROFILES_ACTIVE: test
      TEST_DB_URL: jdbc:postgresql://localhost:5432/urlshortener
      TEST_DB_USER: urlshortener
      TEST_DB_PASSWORD: urlshortener
      TEST_REDIS_HOST: localhost
      TEST_REDIS_PORT: '6379'
      TEST_REDIS_PASSWORD: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run tests
        run: ./mvnw -B -ntp test
      - name: Upload surefire reports (khi fail)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  # ──────────────────────────── FRONTEND ───────────────────────────────
  frontend:
    name: Frontend / Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/UrlShortener
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/UrlShortener/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npx vite build

  # ──────────────────────────── CI GATE ────────────────────────────────
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [backend-test, frontend]
    if: always()
    steps:
      - name: Verify all required jobs succeeded
        run: |
          echo "backend-test: ${{ needs.backend-test.result }}"
          echo "frontend:     ${{ needs.frontend.result }}"
          if [ "${{ needs.backend-test.result }}" != "success" ] || \
             [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "❌ CI thất bại"
            exit 1
          fi
          echo "✅ Tất cả check đã pass"
