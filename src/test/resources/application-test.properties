# Test profile: dùng service container của CI, hoặc localhost khi chạy local.
# Override via env when the local Docker stack uses different values
# (docker compose exposes Redis with REDIS_PASSWORD, default "redis-dev").
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/urlshortener}
spring.datasource.username=${TEST_DB_USER:urlshortener}
spring.datasource.password=${TEST_DB_PASSWORD:urlshortener}

spring.data.redis.host=${TEST_REDIS_HOST:localhost}
spring.data.redis.port=${TEST_REDIS_PORT:6379}
spring.data.redis.password=${TEST_REDIS_PASSWORD:redis-dev}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# JWT secret riêng cho test (không dùng chung secret production)
security.jwt.secret=test-only-secret-key-do-not-use-in-production-1234567890
security.jwt.issuer=urlshortener-test
security.jwt.access-token-expiration=900000
security.jwt.refresh-token-expiration=2592000000

# Tắt rate limit trong test để không phụ thuộc Redis bucket state
ratelimit.enabled=false
