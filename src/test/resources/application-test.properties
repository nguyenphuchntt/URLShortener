# Test profile: dùng service container của CI, hoặc localhost khi chạy local
spring.datasource.url=jdbc:postgresql://localhost:5432/urlshortener
spring.datasource.username=urlshortener
spring.datasource.password=urlshortener

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# JWT secret riêng cho test (không dùng chung secret production)
security.jwt.secret=test-only-secret-key-do-not-use-in-production-1234567890
security.jwt.issuer=urlshortener-test
security.jwt.access-token-expiration=900000
security.jwt.refresh-token-expiration=2592000000

# Tắt rate limit trong test để không phụ thuộc Redis bucket state
ratelimit.enabled=false
